<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pawty · Bonk Island</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#24304a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd8ff;font-family:'Lilita One',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#nogl[hidden]{display:none}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px}
.o{-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 rgba(20,30,50,.35)}
.chip{background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--ink)}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;background:#8fd8ff;z-index:20}
.tags,.pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-size:14px;padding:1px 9px 3px;border-radius:10px;box-shadow:0 0 0 3px var(--ink);white-space:nowrap;color:#fff;text-shadow:0 2px 0 rgba(20,30,50,.35);will-change:transform}
.tag.me{color:var(--ink);text-shadow:none}
.pop{position:absolute;left:0;top:0;white-space:nowrap;animation:popt .75s ease-out forwards}
@keyframes popt{0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg);opacity:1}22%{transform:translate(-50%,-75%) scale(1.15) rotate(4deg);opacity:1}100%{transform:translate(-50%,-150%) scale(1) rotate(0);opacity:0}}

/* top */
.top{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:12px;pointer-events:none}
.lv{font-size:13px;padding:4px 12px 6px;text-align:center;line-height:1;color:#6a7690}
.lv b{display:block;font-weight:400;font-size:24px;color:var(--ink);white-space:nowrap}
.brk{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;font-size:15px;line-height:1}
.brk svg{width:26px;height:26px;flex:none}
.brk b{font-weight:400;font-size:24px;min-width:48px}
.brk.hot{background:#ff5d6c;color:#fff;animation:shake .25s infinite}
.brk.hot svg path{stroke:#fff}
@keyframes shake{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.roster{position:fixed;top:14px;left:14px;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.rs{display:flex;align-items:center;gap:7px;padding:2px 10px 4px 4px;font-size:15px;border-radius:13px;transition:opacity .3s}
.rs i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 3px var(--ink);flex:none}
.rs em{font-style:normal;font-size:12px;background:#ffd23f;border-radius:7px;padding:0 5px 1px;box-shadow:0 0 0 2px var(--ink)}
.rs em:empty{display:none}
.rs.out{opacity:.55}.rs.out span{text-decoration:line-through;text-decoration-thickness:3px}
.mock{position:fixed;top:14px;right:14px;display:flex;border-radius:16px;overflow:hidden;box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--ink)}
.mock button{font:inherit;font-size:16px;border:0;padding:8px 12px 10px;background:#fff;color:var(--ink);cursor:pointer}
.mock button+button{border-left:3px solid var(--ink)}
.mock button:hover{background:#ffd23f}
.feed{position:fixed;left:50%;top:92px;transition:top .2s;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.feed div{font-size:17px;padding:4px 14px 6px;animation:fin .3s ease-out;white-space:nowrap}
@keyframes fin{from{transform:translateY(-12px);opacity:0}}
.ghostbar{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:8px 18px 10px;border-radius:18px;background:#9a7cff;font-size:20px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 5px 0 var(--ink),0 0 0 4px var(--ink);text-shadow:0 2px 0 rgba(20,30,50,.35);white-space:nowrap}
.ghost .ghostbar{display:flex}.ghost .feed{top:146px}
.ghostbar small{font-size:14px;opacity:.9}

/* controls */
.hint{position:fixed;left:14px;bottom:16px;font-size:14px;padding:6px 12px 8px;display:flex;gap:10px;align-items:center}
.hint kbd{font-family:inherit;background:#ffd23f;border-radius:7px;padding:0 6px 1px;box-shadow:0 0 0 2px var(--ink)}
.touch .hint{display:none}
.hint .f,.hint .g{display:flex;gap:10px}.hint .g{display:none}.ghost .hint .f{display:none}.ghost .hint .g{display:flex}
.acts{position:fixed;right:20px;bottom:20px;width:236px;height:206px}
.ab{position:absolute;border:0;border-radius:50%;font:inherit;color:#fff;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-shadow:0 2px 0 rgba(20,30,50,.35);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35),0 6px 0 var(--ink),0 0 0 4px var(--ink);transition:transform .07s;touch-action:none}
.ab svg.i{width:34px;height:34px;position:relative}
.ab span{position:relative}
.ab kbd{position:absolute;top:-9px;right:-6px;font-family:inherit;font-size:12px;background:#fff;color:var(--ink);border-radius:8px;padding:0 6px;box-shadow:0 0 0 3px var(--ink);text-shadow:none;z-index:2}
.touch .ab kbd{display:none}
.ab:active,.ab.down{transform:translateY(4px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 0 var(--ink),0 0 0 4px var(--ink)}
.ab .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(36,48,74,.55) calc(var(--p,0)*1%),transparent 0);pointer-events:none}
.ab.bonk{right:0;bottom:0;width:116px;height:116px;background:#ff5d6c;font-size:17px}
.ab.bonk svg.i{width:46px;height:46px}
.ab.push{right:130px;bottom:6px;width:84px;height:84px;background:#4fb4ff}
.ab.dash{right:30px;bottom:132px;width:74px;height:74px;background:#55d36b;font-size:13px}
.ab.dash svg.i{width:28px;height:28px}
.ab.nut{right:0;bottom:0;width:116px;height:116px;background:#c0814f;font-size:16px;display:none}
.ab.nut svg.i{width:46px;height:46px}
.ghost .ab.bonk,.ghost .ab.push,.ghost .ab.dash{display:none}.ghost .ab.nut{display:flex}
.charge{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);transform:rotate(-90deg);pointer-events:none}
.charge circle{fill:none;stroke-width:8;stroke-linecap:round}
.joy{position:fixed;left:0;bottom:0;width:46%;height:55%;display:none}
.touch .joy{display:block}
.joy .base{position:absolute;width:132px;height:132px;margin:-66px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:0 0 0 4px rgba(36,48,74,.5);left:110px;top:calc(100% - 120px)}
.joy .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--ink),0 5px 0 var(--ink)}

.big{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:92px;pointer-events:none;opacity:0;transform:scale(.6);transition:all .3s cubic-bezier(.3,1.6,.5,1);line-height:1}
.big.on{opacity:1;transform:none}
.big small{display:block;font-size:30px;margin-top:10px}

/* results */
.res{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(36,48,74,.35)}
.res.on{display:flex}
.card{width:min(520px,92vw);padding:18px 20px 20px;border-radius:26px;animation:cin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes cin{from{transform:scale(.7) rotate(-3deg);opacity:0}}
.card .hd{font-size:34px;text-align:center;color:#fff;margin:-46px 0 12px}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:34px 26px 1fr 56px 52px 52px;align-items:center;gap:8px;font-size:18px;padding:4px 10px 6px;border-radius:12px;background:#f1f4fa}
.row.h{background:none;font-size:12px;color:#6a7690;padding:0 10px}
.row.me{background:#fff3c4;box-shadow:inset 0 0 0 3px #ffd23f}
.row .pl{font-size:22px;color:#6a7690}.row.first .pl{color:#ffb81f}
.row i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 3px var(--ink)}
.row .k,.row .p,.row .t{text-align:right}.row .p{color:#2fae46}
.btn{font:inherit;font-size:22px;border:0;border-radius:18px;padding:8px 26px 11px;color:var(--ink);background:#ffd23f;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 5px 0 var(--ink),0 0 0 4px var(--ink)}
.btn:active{transform:translateY(3px)}
.card .ft{display:flex;justify-content:center;margin-top:16px}
.card .note{text-align:center;font-size:13px;color:#6a7690;margin-top:10px}

@media (max-width:760px){
  .top{gap:7px;top:10px}.lv{font-size:10px;padding:3px 8px 5px}.lv b{font-size:17px}
  .brk{font-size:11px;padding:4px 9px 6px;gap:5px}.brk b{font-size:17px;min-width:36px}.brk svg{width:18px;height:18px}.brk span{display:none}
  .roster{top:auto;bottom:auto;top:74px;left:10px;gap:7px}.rs{font-size:0;padding:2px;gap:0}.rs i{width:18px;height:18px}.rs em{display:none}
  .mock{top:auto;bottom:auto;top:74px;right:10px}.mock button{font-size:12px;padding:5px 8px 7px}
  .feed{top:124px}.feed div{font-size:13px}
  .big{font-size:60px}.big small{font-size:22px}
  .acts{transform:scale(.82);transform-origin:100% 100%;right:14px;bottom:14px}
  .ghostbar{font-size:14px;top:124px}.ghost .feed{top:168px}
  .row{grid-template-columns:26px 22px 1fr 44px 40px 40px;font-size:15px;gap:6px}
}
@media (max-height:500px) and (min-width:761px){ /* phone held sideways */
  .top{top:8px;gap:7px}.lv{font-size:10px;padding:3px 8px 5px}.lv b{font-size:17px}
  .brk{font-size:11px;padding:4px 9px 6px;gap:5px}.brk b{font-size:17px;min-width:36px}.brk svg{width:18px;height:18px}
  .roster{top:10px;left:10px;gap:7px}.rs{font-size:12px;padding:1px 8px 3px 3px}.rs i{width:16px;height:16px}.rs em{font-size:10px}
  .mock{top:10px;right:10px}.mock button{font-size:12px;padding:5px 8px 7px}
  .feed{top:62px}.feed div{font-size:13px}
  .big{font-size:54px;top:28%}.big small{font-size:19px}
  .acts{transform:scale(.66);transform-origin:100% 100%;right:12px;bottom:10px}
  .hint{font-size:11px;bottom:10px}
  .ghostbar{font-size:14px;top:62px}.ghost .feed{top:104px}
  .card{padding:10px 14px 12px}.card .hd{font-size:24px;margin:-32px 0 6px}.rows{gap:3px}.row{font-size:14px;padding:2px 10px 3px}.card .ft{margin-top:8px}.btn{font-size:17px;padding:5px 20px 8px}.card .note{display:none}
}
</style>

<script src="core3d/animals.js"></script>
<script type="module">
import * as THREE from 'three';
import { engine, makeScene, followSun, quality } from './core3d/engine.js';
import * as assets from './core3d/assets.js';
import { sfx } from './core3d/sfx.js';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const TOUCH = engine.isTouch;
document.body.classList.toggle('touch', TOUCH);

// ---------- tuning ----------
const WATER_Y = -1.15, S = 1.05, RINGS = 4, GRAV = 24;
const SPEED = 4.4, BOT_SPEED = 3.4, CHARGE_SPEED = 1.7, ACCEL = 14, FR_GROUND = 4, FR_AIR = .9;
const CHARGE_T = .9, BODY_R = .4;
const CD = { push: .45, bonk: 1.1, dash: 2.2, nut: 3.5 };
const BREAK_FIRST = 8, BREAK_EVERY = 8, WARN_T = 2.6;
const PTS = [5, 3, 2, 1, 0, 0], ROUND_MAX = 5;
const ROSTER = [
  { name: 'You', code: 14, col: '#ffc727', me: true },
  { name: 'Mai', code: 0, col: '#ff5d6c' },
  { name: 'Bao', code: 7, col: '#4fb4ff' },
  { name: 'Linh', code: 2, col: '#55d36b' },
  { name: 'Tuan', code: 9, col: '#9a7cff' },
  { name: 'Vy', code: 1, col: '#ff8a4c' },
];

// ---------- scene ----------
const scene = makeScene({ sky: '#8fd8ff', fog: [55, 150], ground: '#4fb0d8' });
engine.setScene(scene);
const cam = engine.camera;
const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3(0, 18, 16);
let shake = 0;

// sea: a gently rolling low-poly plane plus a flat one out to the horizon
const wg = new THREE.PlaneGeometry(110, 110, 64, 64); wg.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(wg, new THREE.MeshLambertMaterial({ color: '#1f97d4', flatShading: true }));
water.position.y = WATER_Y; water.receiveShadow = quality.shadows; scene.add(water);
const farSea = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshLambertMaterial({ color: '#1f97d4' }));
farSea.rotation.x = -Math.PI / 2; farSea.position.y = WATER_Y - .12; scene.add(farSea);
const wpos = wg.attributes.position, wbase = Float32Array.from(wpos.array);
function waves(t) {
  for (let i = 0; i < wpos.count; i++) { const x = wbase[i * 3], z = wbase[i * 3 + 2]; wpos.array[i * 3 + 1] = Math.sin(x * .33 + t * 1.2) * .08 + Math.cos(z * .29 + t * .9) * .08; }
  wpos.needsUpdate = true;
}

// ---------- island: hex columns ----------
const hexToXZ = (q, r) => [S * Math.sqrt(3) * (q + r / 2), S * 1.5 * r];
const hexDist = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
function xzToHex(x, z) {
  const r = z / (1.5 * S), q = x / (Math.sqrt(3) * S) - r / 2;
  let rx = Math.round(q), rz = Math.round(r), ry = Math.round(-q - r);
  const dx = Math.abs(rx - q), dz = Math.abs(rz - r), dy = Math.abs(ry + q + r);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy <= dz) rz = -rx - ry;
  return [rx, rz];
}
const tiles = [], tileMap = new Map();
const capGeo = new THREE.CylinderGeometry(S * .975, S * .975, .24, 6); capGeo.translate(0, -.12, 0);
const colGeo = new THREE.CylinderGeometry(S * .93, S * .55, 3.2, 6); colGeo.translate(0, -.24 - 1.6, 0);
const foamGeo = new THREE.CircleGeometry(S * 1.2, 6); foamGeo.rotateX(-Math.PI / 2); foamGeo.rotateY(Math.PI / 6);
const foamMat = new THREE.MeshBasicMaterial({ color: '#e9fbff', transparent: true, opacity: .8, depthWrite: false });
const dirtMat = new THREE.MeshLambertMaterial({ color: '#c99566' });
const GRASS = ['#86d862', '#8fdf6b', '#7fd05c'], SAND = ['#f6e2a4', '#f0d995'];
for (let q = -RINGS; q <= RINGS; q++) for (let r = -RINGS; r <= RINGS; r++) {
  const ring = hexDist(q, r); if (ring > RINGS) continue;
  const [x, z] = hexToXZ(q, r);
  const base = ring === RINGS ? SAND[(q * 7 + r * 3 & 1)] : GRASS[((q * 5 + r * 11) % 3 + 3) % 3];
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const capM = new THREE.MeshLambertMaterial({ color: base });
  const cap = new THREE.Mesh(capGeo, capM), col = new THREE.Mesh(colGeo, dirtMat), foam = new THREE.Mesh(foamGeo, foamMat);
  cap.receiveShadow = col.receiveShadow = quality.shadows; foam.position.y = WATER_Y + .1;
  g.add(cap, col, foam); scene.add(g);
  const t = { q, r, ring, x, z, g, capM, base: new THREE.Color(base), state: 'ok', t: 0, vy: 0, spin: 0, obst: 0 };
  tiles.push(t); tileMap.set(q + ',' + r, t);
}
const tileAt = (x, z) => tileMap.get(xzToHex(x, z).join(','));
const groundAt = (x, z) => { const t = tileAt(x, z); return !!t && t.state !== 'drop'; };
const safeAt = (x, z) => { const t = tileAt(x, z); return !!t && t.state === 'ok'; };
const islandR = () => tiles.reduce((m, t) => t.state === 'drop' ? m : Math.max(m, Math.hypot(t.x, t.z)), 0) + S;

// ---------- particles / effects ----------
const parts = [];
const sphGeo = new THREE.SphereGeometry(1, 8, 6), starGeo = new THREE.OctahedronGeometry(1, 0);
const M = c => new THREE.MeshBasicMaterial({ color: c });
const PM = { white: M('#ffffff'), yellow: M('#ffd23f'), drop: M('#c8f1ff'), dust: new THREE.MeshLambertMaterial({ color: '#fff7e6' }) };
function part(geo, mat, x, y, z, vx, vy, vz, s, life, g = 0, grow = false) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.setScalar(s); scene.add(m);
  parts.push({ m, vx, vy, vz, s, life, max: life, g, grow });
}
function starsBurst(x, y, z, n, power) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = 2.5 + Math.random() * 3 * power;

function botThink(f, dt) {

  if (!ai.target || ai.target.out || ai.target.falling || Math.random() < .07) {
    others.sort((a, b) => Math.hypot(a.x - f.x, a.z - f.z) - Math.hypot(b.x - f.x, b.z - f.z));

  }

}
